<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes"><title>ResumeTailor — evidence-based resumes</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#161a2b;--mut:#6b7190;--ac:#4f46e5;--ac2:#7c3aed;--bd:#e3e5f1;--ok:#059669;--okb:#d1fae5;--bad:#dc2626;--badb:#fee2e2;--warn:#b45309;--warnb:#fef3c7;--sh:0 6px 24px rgba(40,40,90,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181c30;--tx:#e9ebf7;--mut:#9aa0c0;--ac:#818cf8;--ac2:#a78bfa;--bd:#2a2f4d;--ok:#34d399;--okb:#064e3b;--bad:#f87171;--badb:#4c1d1d;--warn:#fbbf24;--warnb:#4a3410;--sh:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:12px 20px;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;box-shadow:var(--sh)}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px}#who{margin-left:auto;font-size:12px;opacity:.9;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px}
#top{display:flex;gap:4px}#top button{background:transparent;color:#fff;opacity:.8;border:0;padding:6px 12px;border-radius:8px}#top button.on,#top button:hover{background:rgba(255,255,255,.2);opacity:1}
main{max-width:1100px;margin:20px auto;padding:0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh);animation:up .3s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font-size:20px}h3{margin:0 0 8px;font-size:16px}p.m,.m{color:var(--mut)}small{font-size:12px}
button{font:inherit;cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;transition:.15s;min-height:40px}
button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500}button.x{background:var(--badb);color:var(--bad)}button.sm{padding:4px 10px;min-height:30px;font-size:12px}
input,textarea,select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin:3px 0 10px}input:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
textarea{min-height:84px;resize:vertical}label{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.grid{display:grid;gap:14px}
.steps{display:flex;gap:8px;margin-bottom:16px}.step{flex:1;padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--bd);text-align:center;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer}.step.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.drop{border:2px dashed var(--bd);border-radius:14px;padding:26px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.over{border-color:var(--ac);background:rgba(99,102,241,.07)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;margin:2px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--bd)}
.chip.ok{background:var(--okb);color:var(--ok);border-color:transparent}.chip.bad{background:var(--badb);color:var(--bad);border-color:transparent}.chip.warn{background:var(--warnb);color:var(--warn);border-color:transparent}
.b{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--bd);color:var(--mut);font-weight:600}.b.ok{color:var(--ok)}.b.w{color:var(--warn)}.b.bad{color:var(--bad)}
.bar{height:7px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .8s}
.ring{width:110px;height:110px;flex:none}.ring circle{transition:stroke-dasharray 1s ease}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.tpl{border:2px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;position:relative}.tpl.on{border-color:var(--ac);background:rgba(99,102,241,.08)}.tpl input{display:none}
.mini{height:62px;background:#fff;border-radius:6px;border:1px solid var(--bd);padding:7px;margin-bottom:6px}.mini i{display:block;height:4px;background:#cbd0e4;margin:4px 0;border-radius:2px}.mini i:first-child{height:7px;width:55%;background:#1b2a4a;margin:0 auto 6px}.mini.modern i:first-child{margin:0 0 6px}.mini.modern i:nth-child(3){background:#4f46e5}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:3px;margin-bottom:12px}.seg button{flex:1;background:transparent;color:var(--mut);box-shadow:none;min-height:34px}.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.pvwrap{position:sticky;top:70px}
#word{background:#9aa0b8;border-radius:12px;padding:10px;overflow:auto;max-height:78vh;min-height:300px}#word .docx-wrapper{background:transparent!important;padding:0!important}#word section.docx{margin:0 auto 10px!important;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.fallback{background:#fff;color:#111;padding:22px;border-radius:6px;font-family:Calibri,Arial,sans-serif;font-size:13px}.fallback h4{margin:10px 0 2px;border-bottom:1px solid #ccc;font-size:13px}
#busy{position:fixed;inset:0;background:rgba(15,18,32,.55);display:none;align-items:center;justify-content:center;z-index:50;color:#fff;flex-direction:column;gap:12px}#busy.on{display:flex}
.spin{width:42px;height:42px;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}.t{background:#1f2440;color:#fff;padding:10px 16px;border-radius:12px;box-shadow:var(--sh);animation:up .25s}.t.err{background:var(--bad)}
#bot{display:none;position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}#bot button{flex:1;background:transparent;color:var(--mut);font-size:11px;box-shadow:none;display:flex;flex-direction:column;gap:2px;align-items:center;border-radius:10px}#bot button.on{color:var(--ac)}#bot span{font-size:19px}
.auth{display:grid;grid-template-columns:1.1fr 1fr;border-radius:18px;overflow:hidden;max-width:820px;margin:40px auto;box-shadow:var(--sh)}.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:32px}.hero li{margin:8px 0}.auth .card{margin:0;border-radius:0;border:0;box-shadow:none}
@media(max-width:860px){.two,.auth{grid-template-columns:1fr}.pvwrap{position:static}#top{display:none}#bot{display:flex}header{padding:10px 14px}.hide-m{display:none}.ring{width:90px;height:90px}.hero{padding:20px}.auth{margin:14px auto}}
@media(min-width:861px){.only-m{display:none}}
</style></head><body>
<header><span class="logo">📄 ResumeTailor</span><nav id="top"></nav><span id="who"></span></header>
<main id="app"></main><div id="bot"></div><div id="toast"></div><div id="busy"><div class="spin"></div><div id="bm">Working…</div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.2/dist/docx-preview.min.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)],app=$('#app');
let T=localStorage.tok||'',S={job:null,tpl:localStorage.tpl||'classic',ver:null};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,e){const d=document.createElement('div');d.className='t'+(e?' err':'');d.textContent=m;$('#toast').append(d);setTimeout(()=>d.remove(),3800)}
async function busy(msg,fn){$('#bm').textContent=msg;$('#busy').classList.add('on');try{return await fn()}catch(e){toast(e.message,1)}finally{$('#busy').classList.remove('on')}}
async function api(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+T};if(o.json){o.body=JSON.stringify(o.json);o.headers['Content-Type']='application/json';o.method=o.method||'POST'}
 const r=await fetch('/api'+p,o);if(r.status===401&&T&&!p.startsWith('/auth')){logout();throw Error('Session expired — please log in')}
 if(!r.ok){let m=r.statusText;try{const j=await r.json();m=typeof j.detail==='string'?j.detail:'Invalid input'}catch{}throw Error(m)}return r}
const J=async(p,o)=>(await api(p,o)).json();
function logout(){T='';localStorage.removeItem('tok');boot()}
const TABS=[['👤','Profile',()=>profileView()],['🎯','Tailor',()=>tailorView()],['🗂','History',()=>historyView()]];
function nav(i){$('#top').innerHTML=TABS.map((t,k)=>`<button class="${k===i?'on':''}" data-i="${k}">${t[1]}</button>`).join('')+'<button id="lo">Log out</button>';
 $('#bot').innerHTML=TABS.map((t,k)=>`<button class="${k===i?'on':''}" data-i="${k}"><span>${t[0]}</span>${t[1]}</button>`).join('')+'<button id="lo2"><span>🚪</span>Log out</button>';
 $$('[data-i]').forEach(b=>b.onclick=()=>TABS[b.dataset.i][2]());$('#lo').onclick=$('#lo2').onclick=logout;scrollTo(0,0)}
function steps(n){return `<div class="steps">${['1 · Profile','2 · Job & template','3 · Review'].map((x,i)=>`<div class="step ${i+1===n?'on':''}" data-s="${i}">${x}</div>`).join('')}</div>`}
function bindSteps(){$$('.step').forEach(s=>s.onclick=()=>[profileView,tailorView,()=>S.ver?reviewView(S.ver):tailorView()][s.dataset.s]())}
async function boot(){if(!T){$('#top').innerHTML=$('#bot').innerHTML=$('#who').textContent='';return authView()}
 try{const m=await J('/me');$('#who').textContent=m.email+(m.llm_enabled?' · AI on':' · rule-based');profileView()}catch{authView()}}
function authView(){app.innerHTML=`<div class="auth"><div class="hero"><h2>Resumes that tell the truth — tailored to the job.</h2><ul><li>Upload once, reuse for every application</li><li>Every claim is checked against your own evidence</li><li>See missing skills & keywords before you apply</li><li>Preview in Word, export DOCX / PDF</li></ul></div>
 <div class="card"><h2>Welcome</h2><p class="m">Sign in or create an account</p><label>Email</label><input id="e" type="email" autocomplete="email" placeholder="you@example.com"><label>Password (8+ characters)</label><input id="p" type="password" autocomplete="current-password">
 <div class="row"><button id="li" class="grow">Log in</button><button class="s grow" id="rg">Create account</button></div></div></div>`;
 const go=path=>()=>busy('Signing in…',async()=>{const r=await J(path,{json:{email:$('#e').value,password:$('#p').value}});T=r.token;localStorage.tok=T;boot()});
 $('#li').onclick=go('/auth/login');$('#rg').onclick=go('/auth/register')}
/* ---------- profile ---------- */
const FIELDS={contact:['name','email','phone','linkedin','github','portfolio','links[]'],summary:['text'],skills:['skills[]c'],job:['title','organization','start_date','end_date','bullets[]','skills[]c'],internship:['title','organization','start_date','end_date','bullets[]','skills[]c'],project:['title','organization','start_date','end_date','bullets[]','skills[]c','links[]'],education:['title','organization','start_date','end_date','bullets[]'],certification:['title','organization','end_date'],achievement:['title','bullets[]'],extra:['title','bullets[]'],custom:['section','title','organization','start_date','end_date','bullets[]','skills[]c']};
const ICON={contact:'📇',summary:'📝',skills:'🛠',job:'💼',internship:'🎓',project:'🚀',education:'🏫',certification:'📜',achievement:'🏆',extra:'➕',custom:'🧩'};
const LBL={linkedin:'LinkedIn URL',github:'GitHub profile URL',portfolio:'Portfolio / website',links:'other links'},PH={linkedin:'linkedin.com/in/your-name',github:'github.com/your-username',portfolio:'yourname.dev',email:'you@example.com'};
function field(k,v){const m=k.match(/^(\w+)(\[\]c?)?$/),n=m[1],a=m[2],c=a==='[]c',lb=LBL[n]||n.replace('_',' ');if(!a)return `<label>${lb}</label><input data-k="${n}" data-t="s" value="${esc(v)}" placeholder="${PH[n]||''}">`;
 return `<label>${lb} <small>(${c?'comma separated':'one per line'})</small></label><textarea data-k="${n}" data-t="${c?'c':'l'}">${esc((v||[]).join(c?', ':'\n'))}</textarea>`}
const hrefOf=u=>/^(https?:|mailto:|tel:)/i.test(u)?u:'https://'+u;
const SITES={'linkedin.com':'LinkedIn','github.com':'GitHub','gitlab.com':'GitLab','kaggle.com':'Kaggle','leetcode.com':'LeetCode','medium.com':'Medium','behance.net':'Behance','huggingface.co':'Hugging Face'};
const labelOf=u=>{try{const h=new URL(hrefOf(u)).hostname.replace(/^www\./,'');return SITES[h]||h}catch{return u}};
const aLink=(u,txt)=>`<a class="chip ok" href="${esc(hrefOf(u))}" target="_blank" rel="noopener noreferrer">↗ ${txt}</a>`;
function linkRow(f){const d=f.data,urls=f.kind==='contact'?[d.linkedin,d.github,d.portfolio,...(d.links||[])].filter(Boolean):(d.links||[]);return urls.length?`<div style="margin:2px 0 10px">${urls.map(u=>aLink(u,f.kind==='project'?'View project':esc(labelOf(u)))).join('')}</div>`:''}
const FSOPT=`<option value="auto">Auto-fit (fills the page)</option><option value="ref">As in template</option>${[9,9.5,10,10.5,11,11.5,12,12.5,13,14].map(n=>`<option value="${n}">${n} pt</option>`).join('')}`;
const SC={ok:'ok',blocked:'warn',broken:'bad',invalid:'bad'},SI={ok:'✔',blocked:'⚠',broken:'✖',invalid:'✖'};
async function runCheck(urls,sel){if(!urls.length){toast('No web links to check yet');return[]}
 return (await busy('Checking links…',async()=>{const r=(await J('/links/check',{json:{urls}})).results;
  if(sel)$(sel).innerHTML=r.map(x=>`<div class="chip ${SC[x.status]}" style="display:flex;border-radius:10px;gap:8px"><span>${SI[x.status]}</span><span class="grow" style="word-break:break-all">${esc(x.url)}<br><small>${esc(x.detail)}</small></span></div>`).join('');return r}))||[]}
function collectUrls(r){const u=[...((r.contact||{}).links||[])];['experience','projects','education','certifications'].forEach(k=>(r[k]||[]).forEach(i=>u.push(...(i.links||[]))));(r.custom||[]).forEach(c=>c.entries.forEach(i=>u.push(...(i.links||[]))));return [...new Set(u.filter(x=>/^https?:/i.test(x)))]}
function factCard(f){const low=!f.verified&&f.confidence<.7,t=f.data.title||f.data.name||f.data.section||f.kind;
 return `<details class="card" data-id="${f.id}" ${low||f.data.conflict?'open':''}><summary class="row" style="cursor:pointer;list-style:none"><span>${ICON[f.kind]||'•'}</span><b class="grow">${esc(t)} <span class="m" style="font-weight:400">· ${f.kind}</span></b>
 ${f.verified?'<span class="b ok">✔ verified</span>':''}${low?'<span class="b w">needs review</span>':''}${f.data.conflict?'<span class="b bad">conflicting dates</span>':''}</summary><div style="margin-top:12px"><label>Type <small>(wrong section? change it here)</small></label><select class="kd">${Object.keys(FIELDS).map(k=>`<option ${k===f.kind?'selected':''}>${k}</option>`).join('')}</select>${(FIELDS[f.kind]||Object.keys(f.data)).map(k=>field(k,f.data[k.replace(/\[\]c?/,'')])).join('')}
 ${linkRow(f)}<div class="row"><label class="row" style="margin:0"><input type="checkbox" class="pr" ${f.priority?'checked':''} style="width:auto;margin:0">prioritise in ranking</label><span class="grow"></span><button class="sv sm">Save & verify</button><button class="x sm dl">Delete</button></div></div></details>`}
function collect(el){const d={};$$('[data-k]',el).forEach(i=>{const t=i.dataset.t,v=i.value;d[i.dataset.k]=t==='s'?v:t==='c'?v.split(',').map(x=>x.trim()).filter(Boolean):v.split('\n').map(x=>x.trim()).filter(Boolean)});return d}
const SEV={high:'bad',med:'warn',low:''};
function linksCard(L){const mini='style="padding:0 8px;min-height:20px;font-size:11px"';return `<div class="card" id="lkc"><div class="row"><h2 class="grow">🔗 Links</h2><button class="s sm" id="chk">🔎 Check my links</button></div><p class="m"><small>Recruiters click these. They become clickable in your DOCX and PDF.</small></p>
 <div>${L.found.map(x=>aLink(x.url,esc(x.label))).join('')}${L.missing.map(n=>`<span class="chip bad">${n} missing <button class="sm" data-addlink="${n==='LinkedIn'?'linkedin':'github'}" ${mini}>Add</button></span>`).join('')}${L.optional_missing.map(n=>`<span class="chip warn">${n} (optional) <button class="sm" data-addlink="portfolio" ${mini}>Add</button></span>`).join('')}</div>
 ${L.projects_without_link.length?`<p style="margin:10px 0 2px"><b>Projects without a link</b> <small class="m">(a GitHub or live-demo link helps)</small></p>${L.projects_without_link.map(p=>`<span class="chip warn">${esc(p.title)} <button class="sm" data-openfact="${p.fact_id}" ${mini}>Add link</button></span>`).join('')}`:''}
 <div id="chkres" style="margin-top:10px"></div></div>`}
const QUICK=[['🏫','Education','education',{}],['🚀','Project','project',{}],['💼','Job','job',{}],['🎓','Internship','internship',{}],['🛠','Skills','#skills'],['📜','Certification','certification',{}],['🏆','Achievement','achievement',{}],['🏁','Hackathon','custom',{section:'Hackathons'}],['🤝','Volunteering','custom',{section:'Volunteering'}],['📚','Publication','custom',{section:'Publications'}],['🔬','Research','custom',{section:'Research'}],['🌐','Open source','custom',{section:'Open Source'}],['🗣','Languages','extra',{title:'Languages'}],['🔗','Link','#link'],['✍️','Own section','custom',{section:''}],['📋','Paste text','#paste']];
function analysisCard(a){return `<div class="card" id="an"><div class="row"><h2 class="grow">🔍 Resume analysis</h2><span class="b ${a.completeness>=75?'ok':'w'}">Completeness ${a.completeness}%</span></div><p class="m"><small>Everything we found in your upload, section by section. Fix what is wrong before generating.</small></p>
 <div>${Object.entries(a.counts).map(([k,n])=>`<span class="chip">${ICON[k]||''} ${k} <b>${n}</b></span>`).join('')||'<span class="m">Nothing found yet.</span>'}</div>
 <div style="margin-top:10px">${a.issues.map(i=>`<div class="chip ${SEV[i.severity]}" style="display:flex;border-radius:10px;gap:8px"><span class="grow">${esc(i.message)}</span>${i.fix?`<button class="sm" data-fix="${i.fact_id}" data-kind="${i.fix.kind}">${esc(i.fix.label)}</button>`:''}</div>`).join('')||'<div class="chip ok">✔ Everything looks complete</div>'}</div></div>`}
function openAdd(q,preset){const [ic,label,kind,pre]=q,box=$('#addbox');box.style.display='block';let body;
 if(kind==='#skills')body='<label>Skills (comma separated)</label><textarea id="ns" placeholder="e.g. Python, SQL, Docker"></textarea>';
 else if(kind==='#link')body=`<label>Link type</label><select id="lt">${[['linkedin','LinkedIn'],['github','GitHub profile'],['portfolio','Portfolio / website'],['links','Other link']].map(([v,l])=>`<option value="${v}" ${v===preset?'selected':''}>${l}</option>`).join('')}</select><label>Web address</label><input id="nl" placeholder="linkedin.com/in/your-name">`;
 else if(kind==='#paste')body='<label>Paste any text — we sort it into sections</label><textarea id="np" style="min-height:140px" placeholder="Projects&#10;My App | 2024&#10;• Built …"></textarea>';
 else body=FIELDS[kind].map(k=>field(k,pre[k.replace(/\[\]c?/,'')])).join('');
 box.innerHTML=`<h3>${ic} Add ${label}</h3><div id="af">${body}</div><div class="row"><button id="asv">Save</button><button class="s" id="acn">Cancel</button></div>`;box.scrollIntoView({behavior:'smooth'});
 $('#acn').onclick=()=>box.style.display='none';
 $('#asv').onclick=()=>busy('Saving…',async()=>{
  if(kind==='#skills')await J('/profile/skills',{json:{skills:$('#ns').value.split(',')}});
  else if(kind==='#link'){const l=$('#nl').value.trim(),t=$('#lt').value;if(!l)throw Error('Enter a link');const f=(await J('/profile')).find(x=>x.kind==='contact'),d={...(f?f.data:{})};
   t==='links'?d.links=[...(d.links||[]),l]:d[t]=l;f?await J('/profile/facts/'+f.id,{method:'PATCH',json:{data:d}}):await J('/profile/facts',{json:{kind:'contact',data:d}})}
  else if(kind==='#paste'){const r=await J('/profile/text',{json:{text:$('#np').value}});toast(r.facts_added+' item(s) added')}
  else{const d=collect($('#af'));if(!(d.title||'').trim()&&!(d.bullets||[]).length)throw Error('Fill in at least a title or description');await J('/profile/facts',{json:{kind,data:d}})}
  toast('Added ✔');profileView()})}
async function profileView(){nav(0);const [facts,an]=await Promise.all([J('/profile'),J('/profile/analysis')]),ver=facts.filter(f=>f.verified).length,pct=facts.length?Math.round(100*ver/facts.length):0;
 app.innerHTML=steps(1)+`<div class="card"><h2>Build your career profile</h2><p class="m">Upload a resume (PDF, DOCX or TXT). We read every section, then you can review and add more.</p>
 <div class="drop" id="dz"><div style="font-size:30px">📤</div><b>Drop a file here or tap to choose</b><div class="m"><small>PDF · DOCX · TXT, up to 5 MB</small></div><input type="file" id="f" accept=".pdf,.docx,.txt" hidden></div></div>
 ${analysisCard(an)}
 ${linksCard(an.links)}
 <div class="card"><h2>➕ Add something new</h2><p class="m"><small>Anything not in your resume yet — or something we missed.</small></p><div class="row" style="gap:6px">${QUICK.map((q,i)=>`<button class="s sm" data-q="${i}">${q[0]} ${q[1]}</button>`).join('')}</div><div id="addbox" style="display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--bd)"></div></div>
 <div class="card"><div class="row"><b class="grow">Details verified: ${ver}/${facts.length}</b></div><div class="bar" style="margin-top:10px"><i style="width:${pct}%"></i></div></div>
 <div id="fl">${facts.map(factCard).join('')||'<div class="card m">No details yet — upload a resume or add something above.</div>'}</div><div class="row"><button id="nx">Next: job description →</button></div>`;bindSteps();
 const dz=$('#dz'),fi=$('#f');dz.onclick=()=>fi.click();dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();up(e.dataTransfer.files[0])};fi.onchange=()=>up(fi.files[0]);
 const up=f=>f&&busy('Reading every section of your resume…',async()=>{const fd=new FormData();fd.append('file',f);const r=await J('/files',{method:'POST',body:fd});toast(r.status==='failed'?'Parse failed: '+r.error:`Done — ${r.facts_added} details found. Check the analysis below.`,r.status==='failed');await profileView();$('#an')&&$('#an').scrollIntoView({behavior:'smooth'})});
 $$('[data-q]').forEach(b=>b.onclick=()=>openAdd(QUICK[b.dataset.q]));
 $$('[data-fix]').forEach(b=>b.onclick=()=>busy('Fixing…',async()=>{await J('/profile/facts/'+b.dataset.fix,{method:'PATCH',json:{kind:b.dataset.kind}});toast('Moved');profileView()}));
 $$('[data-addlink]').forEach(b=>b.onclick=()=>openAdd(QUICK.find(q=>q[2]==='#link'),b.dataset.addlink));
 $$('[data-openfact]').forEach(b=>b.onclick=()=>{const d=$(`#fl details[data-id="${b.dataset.openfact}"]`);d.open=true;d.scrollIntoView({behavior:'smooth'});const t=$('[data-k="links"]',d);t&&t.focus()});
 $('#chk').onclick=()=>runCheck(an.links.all_urls,'#chkres');
 $('#nx').onclick=tailorView;
 $$('#fl details').forEach(c=>{const id=c.dataset.id;$('.sv',c).onclick=()=>busy('Saving…',async()=>{await J('/profile/facts/'+id,{method:'PATCH',json:{kind:$('.kd',c).value,data:collect(c),priority:+$('.pr',c).checked}});toast('Saved & verified');profileView()});
  $('.dl',c).onclick=()=>confirm('Delete this detail?')&&busy('Deleting…',async()=>{await J('/profile/facts/'+id,{method:'DELETE'});profileView()})})}
/* ---------- tailor ---------- */
async function tailorView(keep){nav(1);const tpls=await J('/templates');if(!tpls.some(t=>t.id===S.tpl))S.tpl='classic';
 app.innerHTML=steps(2)+`<div class="two"><div><div class="card"><h2>Paste the job description</h2><textarea id="jd" style="min-height:230px" placeholder="Paste the full job posting here…">${esc(keep||S.jdText||'')}</textarea><button id="an">🔍 Analyse job & rank my experience</button></div></div>
 <div class="card"><h2>Resume template</h2><p class="m"><small>Pick a built-in layout or upload a reference resume as DOCX, PDF or a photo/screenshot. DOCX: we reuse its own paragraph formatting, section order, heading wording, bullets and date alignment (tables/images are removed to stay ATS-safe). PDF/image: look and section order are estimated.</small></p>
 <div class="tpls" id="tp">${tpls.map(t=>`<label class="tpl ${t.id===S.tpl?'on':''}"><input type="radio" name="t" value="${t.id}"><div class="mini ${t.id}"><i></i><i></i><i></i><i></i></div><b style="font-size:13px">${esc(t.label)}</b>${t.custom?`<button class="x sm" data-del="${t.id}" style="position:absolute;top:4px;right:4px;padding:0 7px;min-height:22px">✕</button>`:''}</label>`).join('')}</div>
 <div style="margin-top:12px"><button class="s" id="ut">📎 Upload reference resume (DOCX, PDF or image)</button><input type="file" id="tf" accept=".docx,.pdf,.png,.jpg,.jpeg,.webp" hidden></div>
 <label style="margin-top:14px;display:block">Link text on the resume</label><select id="lsel"><option value="url">Show web addresses (safest for ATS)</option><option value="label">Show labels: LinkedIn | GitHub</option></select>
 <label style="margin-top:14px;display:block">Font size</label><select id="fsel">${FSOPT}</select><small class="m">Auto-fit makes the text as large as the page allows, so there is no big empty space at the bottom.</small></div></div><div id="res"></div>`;bindSteps();
 $$('.tpl').forEach(l=>l.onclick=e=>{if(e.target.dataset.del)return;S.tpl=$('input',l).value;localStorage.tpl=S.tpl;$$('.tpl').forEach(x=>x.classList.toggle('on',x===l))});
 $$('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();busy('Removing…',async()=>{await J('/templates/'+b.dataset.del,{method:'DELETE'});S.tpl='classic';tailorView($('#jd').value)})});
 $('#ut').onclick=()=>$('#tf').click();$('#tf').onchange=()=>busy('Reading your template…',async()=>{const fd=new FormData();fd.append('file',$('#tf').files[0]);const r=await J('/templates',{method:'POST',body:fd});S.tpl=r.id;localStorage.tpl=r.id;toast('Template added');tailorView($('#jd').value)});
 $('#an').onclick=()=>{S.jdText=$('#jd').value;busy('Analysing job…',async()=>{const r=await J('/job-descriptions',{json:{text:S.jdText}});S.job=r.id;showAnalysis(r)})}}
const chips=(a,c,btn)=>a.length?a.map(x=>`<span class="chip ${c}">${esc(x)}${btn?`<button class="sm" data-have="${esc(x)}" style="padding:0 8px;min-height:20px;font-size:11px">I have this</button>`:''}</span>`).join(''):'<span class="m">none</span>';
function haveBtns(after){$$('[data-have]').forEach(b=>b.onclick=()=>confirm(`Add “${b.dataset.have}” to your profile skills? Only do this if you genuinely have this skill.`)&&busy('Adding skill…',async()=>{await J('/profile/skills',{json:{skills:[b.dataset.have]}});toast('Added to your profile');after()}))}
function showAnalysis(r){const q=r.requirements,g=r.profile_gaps;$('#res').innerHTML=`<div class="card"><h2>What the job asks for</h2><p><b>Required</b><br>${chips(q.required_skills.map(s=>s.name),'')}</p><p><b>Preferred</b><br>${chips(q.preferred_skills.map(s=>s.name),'')}</p><p><b>Domain</b> ${chips(q.domain_terms,'')} ${q.seniority?`<span class="b">${esc(q.seniority)}</span>`:''}</p></div>
 <div class="card"><h2>⚠ Gaps in your profile</h2><p class="m"><small>Required and preferred skills with no evidence in your profile. Add them only if true.</small></p><p><b>Missing required</b><br>${chips(g.missing_required,'bad',1)}</p><p><b>Missing preferred</b><br>${chips(g.missing_preferred,'warn',1)}</p></div>
 <div class="card"><h2>Relevance ranking</h2>${r.ranking.map(x=>`<div style="margin:12px 0"><div class="row"><b class="grow">${esc(x.title)}</b><span class="b">${x.kind}</span><b>${Math.round(x.score*100)}%</b></div><div class="bar"><i style="width:${x.score*100}%"></i></div><small class="m">matched: ${x.matched_skills.map(esc).join(', ')||'none'} · skills ${x.breakdown.skill} · responsibilities ${x.breakdown.resp} · domain ${x.breakdown.domain} · recency ${x.breakdown.recency}</small></div>`).join('')||'<p class="m">No experiences in profile yet.</p>'}
 <button id="gd">✨ Generate best-match resume</button></div>`;haveBtns(()=>busy('Re-analysing…',async()=>showAnalysis(await J('/job-descriptions',{json:{text:S.jdText}}))));
 $('#gd').onclick=()=>busy('Building & optimising your resume…',async()=>{const d=await J('/resume-drafts',{json:{job_id:S.job,template:S.tpl,link_style:$('#lsel')?$('#lsel').value:'url',font_size:$('#fsel')?$('#fsel').value:'auto'}});reviewView(d.id)});$('#res').scrollIntoView()}
/* ---------- review ---------- */
function ring(v){const c=v>=70?'var(--ok)':v>=45?'var(--warn)':'var(--bad)';return `<svg viewBox="0 0 36 36" class="ring"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--bd)" stroke-width="3"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="0 100" data-v="${v}" transform="rotate(-90 18 18)"/><text x="18" y="20.5" text-anchor="middle" font-size="9" font-weight="700" fill="currentColor">${v}</text></svg>`}
function fallback(r){const c=r.contact||{};return `<div class="fallback"><h3 style="text-align:center;margin:0">${esc(c.name)}</h3><div style="text-align:center">${esc([c.email,c.phone,...(c.links||[])].filter(Boolean).join(' | '))}</div>${r.summary?`<h4>SUMMARY</h4>${esc(r.summary)}`:''}${r.skills.length?`<h4>SKILLS</h4>${esc(r.skills.map(s=>s.name).join(', '))}`:''}${[['EXPERIENCE',r.experience],['PROJECTS',r.projects],['EDUCATION',r.education],['CERTIFICATIONS',r.certifications]].filter(x=>x[1].length).map(([h,a])=>`<h4>${h}</h4>${a.map(i=>`<b>${esc(i.title)}</b> ${esc([i.organization,i.start_date&&i.start_date+' – '+i.end_date].filter(Boolean).join(' | '))}<ul>${(i.bullets||[]).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`).join('')}`).join('')}</div>`}
async function renderWord(id,r){const box=$('#word');try{const blob=await(await api(`/resume-versions/${id}/docx`)).blob();if(!window.docx)throw 0;box.innerHTML='';await docx.renderAsync(blob,box,null,{inWrapper:true,breakPages:true});
 const pg=$('section.docx',box),w=$('.docx-wrapper',box);if(pg&&w)w.style.zoom=Math.min(1,(box.clientWidth-20)/pg.offsetWidth)}catch{box.innerHTML=fallback(r)}}
function insights(rep,warns){if(!rep)return '';const dm=rep.missing_details;return `<div class="card"><div class="row" style="gap:16px">${ring(rep.score)}<div class="grow"><h2>Match score</h2><p class="m" style="margin:0"><small>Keyword & requirement coverage of this resume vs the job. It is a guide, not a hiring probability.</small></p></div></div></div>
 ${rep.ats?`<div class="card"><h3>🤖 ATS-friendliness</h3>${rep.ats.map(a=>`<div class="chip ${a.ok?'ok':'warn'}" style="display:flex;border-radius:10px">${a.ok?'✔':'⚠'} ${esc(a.message)}</div>`).join('')}</div>`:''}
 ${rep.unused_facts&&rep.unused_facts.length?`<div class="card"><h3>📦 Left out to fit the page limit</h3><p class="m"><small>Lowest relevance for this job. Everything else from your profile is used.</small></p>${chips(rep.unused_facts,'warn')}</div>`:''}
 <div class="card"><h3>✔ Job keywords on your resume</h3>${chips(rep.covered,'ok')}<h3 style="margin-top:12px">⚠ Missing required skills</h3><p class="m"><small>Not in your profile at all. Add only if true.</small></p>${chips(rep.missing_required,'bad',1)}
 <h3 style="margin-top:12px">Missing preferred skills</h3>${chips(rep.missing_preferred,'warn',1)}
 ${rep.unused_supported.length?`<h3 style="margin-top:12px">💡 In your profile but not on this resume</h3><p class="m"><small>Mention these in your bullets or skills if relevant.</small></p>${chips(rep.unused_supported,'warn')}`:''}
 ${(rep.terms_found&&(rep.terms_found.length||rep.terms_missing.length))?`<h3 style="margin-top:12px">🔑 Job terms</h3><p class="m"><small>Green = on your resume. Grey = not supported by your profile.</small></p>${chips(rep.terms_found,'ok')}${chips(rep.terms_missing,'')}`:''}
 ${rep.domain_missing.length?`<h3 style="margin-top:12px">Domain terms not reflected</h3>${chips(rep.domain_missing,'')}`:''}</div>
 ${rep.links_report?`<div class="card"><div class="row"><h3 class="grow">🔗 Links on this resume</h3><button class="s sm" id="chk2">🔎 Check links</button></div>${rep.links_report.shown.map(x=>aLink(x.url,esc(x.label)+' <small>· '+esc(x.where)+'</small>')).join('')||'<span class="m">No links on this resume yet.</span>'}${rep.links_report.missing.map(n=>`<span class="chip bad">${n} missing — add it on the Profile page</span>`).join('')}${rep.links_report.projects_without_link.map(p=>`<span class="chip warn">${esc(p.title)}: no project link — add one under Edit</span>`).join('')}<div id="chkres2" style="margin-top:10px"></div></div>`:''}
 <div class="card"><h3>📋 Missing details</h3>${dm.length?dm.map(d=>`<div class="chip warn" style="display:flex;border-radius:10px">${esc(d.message)}</div>`).join(''):'<span class="chip ok">Nothing important missing</span>'}</div>
 <div class="card"><h3>🔎 Claim check</h3>${warns.length?warns.map(w=>`<div class="chip ${w.type==='info'?'':'warn'}" style="display:flex;border-radius:10px">${esc(w.message)}</div>`).join(''):'<span class="chip ok">Every claim is backed by your profile</span>'}</div>`}
async function reviewView(id,tab='ins'){nav(1);S.ver=id;const v=await J('/resume-versions/'+id);let r=v.resume,rep=v.report,warns=v.warnings;const items=[...r.experience,...r.projects];
 app.innerHTML=steps(3)+`<div class="seg" id="seg"><button data-t="ins">Insights</button><button data-t="edit">Edit</button><button data-t="pv" class="only-m">Word preview</button></div>
 <div class="two" id="rv"><div><div id="ins"></div><div id="edit" class="card"><h3>Edit text</h3><label>Summary</label><textarea id="sm">${esc(r.summary)}</textarea>${items.map((x,i)=>`<label>${esc(x.title)} <small>· one bullet per line</small></label><textarea data-b="${i}">${esc(x.bullets.join('\n'))}</textarea><label>Links <small>· one per line (GitHub, live demo…)</small></label><textarea data-l="${i}" style="min-height:48px">${esc((x.links||[]).join('\n'))}</textarea>${(x.links||[]).map(u=>aLink(u,'View project')).join('')}`).join('')}<button id="sv">Save edits & refresh</button></div></div>
 <div class="pvwrap" id="pv"><div class="row" style="margin-bottom:8px"><b class="grow">📄 Word preview</b><select id="fs" title="Text size of the resume" style="width:auto;margin:0;padding:4px 8px">${FSOPT}</select><select id="ls" title="How links appear on the resume" style="width:auto;margin:0;padding:4px 8px"><option value="url">Web addresses</option><option value="label">Labels</option></select><button class="s sm" id="rg">↻ Regenerate</button><button class="sm" id="dx">⬇ DOCX</button><button class="sm" id="dp">⬇ PDF</button></div><div id="word"><div class="m" style="padding:20px;color:#fff">Rendering preview…</div></div></div></div>`;bindSteps();
 const paint=()=>{$('#ins').innerHTML=insights(rep,warns);setTimeout(()=>$$('circle[data-v]').forEach(c=>c.setAttribute('stroke-dasharray',c.dataset.v+' 100')),60);$('#chk2')&&($('#chk2').onclick=()=>runCheck(collectUrls(r),'#chkres2'));haveBtns(()=>busy('Rebuilding resume…',async()=>{const d=await J('/resume-drafts',{json:{job_id:v.job_id,template:v.template,link_style:r.link_style||'url',font_size:r.font_size||'auto'}});reviewView(d.id)}))};paint();renderWord(id,r);$('#ls').value=r.link_style||'url';$('#fs').value=r.font_size||'auto';
 const show=t=>{$$('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const m=innerWidth<=860;$('#ins').style.display=t==='ins'?'':'none';$('#edit').style.display=t==='edit'?'':'none';$('#pv').style.display=m&&t!=='pv'?'none':''};
 $$('#seg button').forEach(b=>b.onclick=()=>show(b.dataset.t));show(tab);addEventListener('resize',()=>show($('#seg .on').dataset.t),{once:true});
 const save=()=>{r.summary=$('#sm').value;r.link_style=$('#ls').value;r.font_size=$('#fs').value;$$('[data-l]').forEach(t=>items[t.dataset.l].links=t.value.split('\n').map(s=>s.trim()).filter(Boolean));$$('[data-b]').forEach(t=>items[t.dataset.b].bullets=t.value.split('\n').map(s=>s.trim()).filter(Boolean));return busy('Saving…',async()=>{const o=await J('/resume-versions/'+id,{method:'PATCH',json:{resume_json:r}});rep=o.report;warns=o.warnings;paint();await renderWord(id,r);return 1})};
 $('#fs').onchange=async()=>{if(await save())toast('Font size updated')};
 $('#ls').onchange=async()=>{if(await save())toast($('#ls').value==='label'?'Labels look cleaner, but web addresses are safer for ATS parsers':'Showing web addresses')};
 $('#sv').onclick=async()=>{if(await save()){toast('Saved — preview updated');if(innerWidth<=860)show('pv')}};
 $('#rg').onclick=()=>busy('Regenerating…',async()=>{const d=await J('/resume-drafts',{json:{job_id:v.job_id,template:v.template,link_style:r.link_style||'url',font_size:r.font_size||'auto'}});reviewView(d.id)});
 const dl=f=>async()=>{if(!await save())return;const chk=await runCheck(collectUrls(r),null),bad=chk.filter(x=>x.status==='broken'||x.status==='invalid');if(bad.length&&!confirm('These links look broken:\n'+bad.map(x=>'• '+x.url+' — '+x.detail).join('\n')+'\n\nDownload anyway?'))return;await busy('Preparing '+f.toUpperCase()+'…',async()=>{const e=await J(`/resume-versions/${id}/exports`,{json:{format:f}});const b=await(await api('/exports/'+e.id)).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='resume.'+f;a.click()})};
 $('#dx').onclick=dl('docx');$('#dp').onclick=dl('pdf')}
async function historyView(){nav(2);const v=await J('/resume-versions');app.innerHTML=`<div class="card"><h2>Saved resume versions</h2>${v.map(x=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--bd)"><span class="grow">${new Date(x.created_at*1000).toLocaleString()}</span><span class="b">${esc(x.template.startsWith('tpl_')?'custom':x.template)}</span><span class="b">${x.status}</span><button class="s sm" data-v="${x.id}">Open</button></div>`).join('')||'<p class="m">None yet — generate your first tailored resume.</p>'}</div>`;
 $$('[data-v]').forEach(b=>b.onclick=()=>reviewView(b.dataset.v))}
boot();
</script></body></html>
